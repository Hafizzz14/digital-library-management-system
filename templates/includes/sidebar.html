<style>
    /* Styling Navigasi Clean & Modern */
    .digilib-sidebar {
        min-height: 100vh;
        background-color: #ffffff;
        border-right: 1px solid #eaeaea;
        box-shadow: 2px 0 10px rgba(0,0,0,0.02);
    }
    
    .sidebar-heading {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #adb5bd;
        font-weight: 700;
        margin-top: 1.5rem;
        margin-bottom: 0.75rem;
        padding-left: 1rem;
    }

    .digilib-sidebar .nav-link {
        color: #495057;
        border-radius: 8px;
        padding: 0.6rem 1rem;
        margin-bottom: 0.25rem;
        font-weight: 500;
        transition: all 0.2s ease;
        display: flex;
        align-items: center;
    }

    .digilib-sidebar .nav-link i {
        font-size: 1.1rem;
        color: #6c757d;
        transition: color 0.2s ease;
    }

    .digilib-sidebar .nav-link:hover {
        background-color: #f8f9fa;
        color: var(--primary-color, #2b547e);
        transform: translateX(3px);
    }

    .digilib-sidebar .nav-link:hover i {
        color: var(--primary-color, #2b547e);
    }

    /* Active State Styling */
    .digilib-sidebar .nav-link.active {
        background-color: rgba(43, 84, 126, 0.1);
        color: var(--primary-color, #2b547e);
        font-weight: 600;
    }

    .digilib-sidebar .nav-link.active i {
        color: var(--primary-color, #2b547e);
    }
</style>

<div class="digilib-sidebar p-3 d-flex flex-column">
    <!-- Brand Logo -->
    <a href="{% url 'dashboard' %}" class="d-flex align-items-center mb-4 mt-2 text-dark text-decoration-none px-2">
        <div class="bg-primary text-white rounded-circle d-flex justify-content-center align-items-center me-2 shadow-sm" style="width: 35px; height: 35px;">
            <i class="bi bi-book-half"></i>
        </div>
        <span class="fs-4 fw-bold" style="letter-spacing: -0.5px;">DigiLib</span>
    </a>

    <ul class="nav nav-pills flex-column mb-auto">
        
        <!-- Dashboard -->
        <li class="nav-item">
            <a href="{% url 'dashboard' %}" class="nav-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
                <i class="bi bi-speedometer2 me-3"></i>Dashboard
            </a>
        </li>

        <!-- Master Data Group -->
        <li class="sidebar-heading">Master Data</li>
        
        <li>
            <a href="{% url 'kategori_list' %}" class="nav-link {% if 'kategori' in request.resolver_match.url_name %}active{% endif %}">
                <i class="bi bi-tags me-3"></i>Kategori
            </a>
        </li>
        <li>
            <a href="{% url 'book_list' %}" class="nav-link {% if 'book' in request.resolver_match.url_name %}active{% endif %}">
                <i class="bi bi-journal-bookmark me-3"></i>Data Buku
            </a>
        </li>
        <li>
            <a href="{% url 'anggota_list' %}" class="nav-link {% if 'anggota' in request.resolver_match.url_name %}active{% endif %}">
                <i class="bi bi-people me-3"></i>Anggota
            </a>
        </li>

        <!-- Sirkulasi Group -->
        <li class="sidebar-heading">Sirkulasi</li>
        
        <li>
            <a href="{% url 'transaksi_list' %}" class="nav-link {% if 'transaksi' in request.resolver_match.url_name or 'peminjaman' in request.resolver_match.url_name or 'pengembalian' in request.resolver_match.url_name %}active{% endif %}">
                <i class="bi bi-arrow-left-right me-3"></i>Transaksi
            </a>
        </li>
    </ul>

    <hr class="text-muted">
    
    <!-- User Profile & Logout -->
    <div class="px-2 pb-2">
        <div class="d-flex align-items-center mb-3">
            <div class="bg-light border rounded-circle d-flex justify-content-center align-items-center me-2" style="width: 32px; height: 32px;">
                <i class="bi bi-person-fill text-secondary"></i>
            </div>
            <div class="small fw-semibold text-truncate">{{ user.username|title }}</div>
        </div>
        <form method="post" action="{% url 'logout' %}" class="w-100">
            {% csrf_token %}
            <button type="submit" class="btn btn-light w-100 text-start text-danger fw-medium d-flex align-items-center border-0 hover-bg transition-all">
                <i class="bi bi-box-arrow-left me-2"></i>Keluar
            </button>
        </form>
    </div>
</div>
