{% extends 'base.html' %}

{% block title %}Login - DigiLib{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="col-md-4">
        <div class="card digilib-card p-4">
            <div class="text-center mb-4">
                <i class="bi bi-book-half display-4" style="color: var(--primary-color);"></i>
                <h3 class="fw-bold mt-2">DigiLib</h3>
                <p class="text-muted">Sign in to start your session</p>
            </div>

            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="id_username" class="form-label fw-semibold">Username</label>
                    <input type="text" name="username" class="form-control form-control-lg" required id="id_username">
                </div>
                <div class="mb-4">
                    <label for="id_password" class="form-label fw-semibold">Password</label>
                    <input type="password" name="password" class="form-control form-control-lg" required id="id_password">
                </div>
                <button type="submit" class="btn btn-primary-custom btn-lg w-100">Login to Dashboard</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
